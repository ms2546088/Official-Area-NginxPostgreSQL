when:
  - event: [push, manual]

steps:
  - name: validate
    image: alpine:3.20
    commands:
      - apk add --no-cache python3 > /dev/null 2>&1
      - echo "Validating docker-compose.yml..."
      - python3 -c "import yaml; yaml.safe_load(open(\"docker-compose.yml\")); print(\"YAML syntax: OK\")" 2>/dev/null || python3 -c "
import json
with open(\"docker-compose.yml\") as f:
    content = f.read()
if \"services:\" in content:
    print(\"Compose structure: OK\")
else:
    print(\"ERROR: No services found\")
    exit(1)
"
      - echo "Checking required files..."
      - test -f docker-compose.yml && echo "docker-compose.yml exists"
      - test -f README.md && echo "README.md exists"
      - echo "Validation complete"

  - name: report
    image: alpine:3.20
    commands:
      - echo "CI passed for Official-Area-NginxPostgreSQL"
      - echo "Commit SHA - pipeline completed successfully"
      - date
