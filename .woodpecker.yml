when:
  - event: [push, manual]

steps:
  - name: validate
    image: alpine:3.20
    commands:
      - echo "Validating Official-Area-NginxPostgreSQL..."
      - test -f docker-compose.yml && echo "docker-compose.yml OK" || exit 1
      - test -f README.md && echo "README.md OK" || echo "README.md missing (warn)"
      - grep -q "services:" docker-compose.yml && echo "Compose structure OK" || exit 1
      - echo "All validations passed"

  - name: report
    image: alpine:3.20
    commands:
      - echo "CI passed for Official-Area-NginxPostgreSQL"
      - date
